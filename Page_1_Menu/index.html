<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spice Junction Menu</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->

<nav class="navbar">

  <div class="logo">
    Spice Junction
  </div>

  <ul class="nav-links">

    <li>
      <a href="index.html">Menu</a>
    </li>

    <li>
      <a href="../Page_2_About/index.html">
        About
      </a>
    </li>

    <li>
      <a href="../Page_3_Careers/careers.html">

      </a>
    </li>

  </ul>

</nav>

  <!-- Header -->

  <header class="hero">

    <h1>Spice Junction</h1>

    <p>
      Delicious food crafted with authentic Indian spices
    </p>

  </header>


  <!-- Filter Buttons -->

  <section class="filters">

    <button class="filter-btn active" data-category="All">
      All
    </button>

    <button class="filter-btn" data-category="Starters">
      Starters
    </button>

    <button class="filter-btn" data-category="Main Course">

    <button class="filter-btn" data-category="Biryani">
      Biryani
    </button>

      Desserts
    </button>

    <button class="filter-btn" data-category="Beverages">
      Beverages
    </button>

  </section>


  <!-- Menu Cards -->

  <main class="menu-container" id="menuContainer">

  </main>


  <!-- Sticky Cart -->

  <div class="cart-bar">

    <div>
      🛒 Items :
      <span id="cartCount">0</span>
    </div>

    <div>
      Total :
      ₹<span id="cartTotal">0</span>
